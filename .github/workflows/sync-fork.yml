name: Sync Fork

on:
  schedule:
    # S'exécute automatiquement tous les soirs à minuit (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permet toujours de lancer la synchronisation manuellement si besoin

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch main
